
{% extends 'base.html' %}

{% block content %}

<div class="form-box">
    <h2>Student Login</h2>

    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit" class="btn">
            Login
        </button>
    </form>

    <p>New Student? <a href="/register">Register</a></p>
</div>

{% endblock %}
