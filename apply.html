
{% extends 'base.html' %}

{% block content %}

<div class="form-box">
    <h2>Apply For Job</h2>

    <h3>{{ job.title }}</h3>
    <p>Company: {{ job.company }}</p>

    <form method="POST">
        <label>Phone Number</label>
        <input type="tel" name="phone"
        pattern="[0-9]{10}" required>

        <label>Education</label>
        <select name="education" required>
            <option value="">Select Education</option>
            <option>BCA</option>
            <option>BBA</option>
            <option>B.Com</option>
            <option>Other</option>
        </select>

        <button type="submit" class="btn">
            Submit Application
        </button>
    </form>
</div>

{% endblock %}
