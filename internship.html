
{% extends 'base.html' %}

{% block content %}

<div class="container">
    <h2>Available Internships</h2>

    <div class="cards">
        {% for job in jobs %}
        <div class="card">
            <h3>{{ job.title }}</h3>
            <p>Company: {{ job.company }}</p>
            <p>Location: {{ job.location }}</p>
            <p>Stipend: {{ job.salary }}</p>
            <p>{{ job.description }}</p>

            <a href="/apply/{{ job.id }}" class="btn">
                Apply Now
            </a>
        </div>
        {% else %}
        <p>No internships available.</p>
        {% endfor %}
    </div>
</div>

{% endblock %}
